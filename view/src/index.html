<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#2563eb" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Weather" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <title>Weather Dashboard</title>
        <link rel="manifest" href="./manifest.json" />
        <link href="./css/style.css" rel="stylesheet" />
        <link rel="icon" type="image/svg+xml" href="./favicon.svg">
        <link rel="icon" type="image/x-icon" href="./favicon.ico">
        <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
        <script src="./js/htmx.min.js"></script>
        <script defer src="./js/alpine.min.js"></script>
        <script defer src="./js/pwa.js"></script>

    </head>
    <body class="bg-gray-100 px-4 py-6 sm:px-6 sm:py-8 xl:px-12">
        <header class="mx-auto mb-6 flex max-w-6xl flex-wrap items-center justify-between gap-4 border-b border-gray-200 pb-4">
            <a href="./index.html" class="text-2xl font-bold text-gray-900 hover:text-blue-700">Weather Dashboard</a>
            <nav aria-label="Main navigation" class="flex items-center gap-4 text-sm font-medium">
                <a href="./index.html" class="text-blue-700 hover:text-blue-900">Home</a>
                <a href="./about.html" class="text-gray-600 hover:text-blue-700">About</a>
                <a href="https://andreanidr.com" target="_blank" rel="noopener noreferrer" class="text-gray-600 hover:text-blue-700">Contact</a>
                <a href="https://github.com/andreanidouglas/weather-dashboard" target="_blank" rel="noopener noreferrer" class="text-gray-600 hover:text-blue-700">Source</a>
            </nav>
        </header>
        <div x-data="{f: {},
           setState(ev) {
                this.f = !this.f;
                localStorage.setItem('x_f', JSON.stringify(this.f));

            },

           init() {
                let v = localStorage.getItem('x_f');
                if (v) {
                    console.log(v);
                    this.f = JSON.parse(v);
                } else {
                    this.f = false;
                    localStorage.setItem('x_f', JSON.stringify(false));
                }
            }
        }">
        <label class="inline-flex items-center py-2 cursor-pointer">
            <input x-model='f' type="checkbox" value="yes" class="sr-only peer" name="fahrenheit" id="fahrenheit" @click="setState($event.target)">
            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-hidden peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:rtl:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:inset-s-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
            <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">Fahrenheit</span>
        </label>
        </div>

        <div x-data="{
            cities: [],
            cityInput: '',
            forecastOpen: false,
            forecastLoading: false,
            forecastError: '',
            forecastDays: [],
            forecastLocation: null,
            forecastRequestId: 0,

            selected: null,

            // When a suggestion is picked, keep its coordinates so the
            // weather is fetched for that exact place (eg Rome, IT vs Rome, US).
            remember(ev) {
                const opt = [...document.querySelectorAll('#city-suggestions option')]
                    .find((o) => o.value === ev.target.value);
                if (opt) {
                    this.selected = { label: opt.value, lat: Number(opt.dataset.lat), lon: Number(opt.dataset.lon) };
                }
            },

            async setData() {
                if (this.cityInput !== '') {
                    const city = (this.selected && this.selected.label === this.cityInput)
                        ? this.selected
                        : this.cityInput;

                    let res = await fetch(cityUrl(city));
                    if (!res.ok) {
                        console.log(`Invalid city ${this.cityInput}`)
                        return;
                    }

                    this.cities.push(city);
                    localStorage.setItem('x_cities', JSON.stringify(this.cities));
                    this.cityInput='';
                    this.selected = null;
                    $nextTick(() => {
                            refresh_grid(cityId(city));
                        }
                    );
                }


            },


            remove() {
                let idx = this.cities.indexOf(this.city);
                this.cities.splice(idx, 1);
                localStorage.setItem('x_cities', JSON.stringify(this.cities));
                console.log(this.cities);
                $nextTick(() => {
                        let cvs = document.querySelectorAll('.cities_c');
                        cvs.forEach((c) => {
                           htmx.process(c)
                        });

                    }
                );
            },
            add() {
                setData();
                $nextTick(() => {
                        let cvs = document.querySelectorAll('.cities_c');
                        cvs.forEach((c) => {
                           htmx.process(c)
                        });

                    }
                );

            },

            async openForecast(location) {
                const requestId = ++this.forecastRequestId;
                this.forecastLocation = location;
                this.forecastDays = [];
                this.forecastError = '';
                this.forecastLoading = true;
                this.forecastOpen = true;

                try {
                    const params = new URLSearchParams({ lat: location.lat, lon: location.lon });
                    if (location.fahrenheit) params.set('fahrenheit', 'yes');
                    const response = await fetch(`/api/forecast?${params.toString()}`);
                    if (!response.ok) throw new Error('Forecast request failed');
                    const forecast = await response.json();
                    if (requestId !== this.forecastRequestId) return;
                    this.forecastDays = forecast.days || [];
                } catch (_) {
                    if (requestId === this.forecastRequestId) {
                        this.forecastError = 'Unable to load the forecast right now. Please try again.';
                    }
                } finally {
                    if (requestId === this.forecastRequestId) this.forecastLoading = false;
                }
            },

            closeForecast() {
                this.forecastOpen = false;
                this.forecastRequestId++;
            },

            init() {
                let cities = localStorage.getItem('x_cities');
                if (cities) {
                    let ct = JSON.parse(cities);
                    const al = ct.filter((v) => v);
                    this.cities = al;
                }
                else {
                    this.cities = ['Dubai', 'Montreal', 'Perth', 'Johannesburg'];
                    localStorage.setItem('x_cities', JSON.stringify(this.cities));
                }
            },

        }">

            <h1 class="sr-only">Weather Dashboard</h1>

            <div class="flex gap-2 my-4">
            <input
               class="flex-1 min-w-0 sm:flex-none sm:w-80 bg-white border border-gray-300 rounded-md px-4 py-2 text-base focus:outline-hidden focus:ring-2 focus:ring-blue-500" placeholder="Enter city..."
                @keyup.enter="setData"
                @input="remember"
                x-model="cityInput"
                id="cityInput"
                name="q"
                list="city-suggestions"
                hx-get="/api/suggest"
                hx-trigger="keyup changed delay:300ms"
                hx-target="#city-suggestions"
                hx-swap="innerHTML"
                autocomplete="off"
                enterkeyhint="go"
                type="text">
            <datalist id="city-suggestions">
                <!-- Dynamic options injected here -->
            </datalist>
            <button @click="setData" class="shrink-0 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-md">Add</button>
            </div>


        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3" id="grid">
            <template x-for="city in cities" :key="cityId(city)">

                <div :id="cityId(city)" class="cities_c" hx-trigger="load, every 30s, change from:(#fahrenheit)" x-bind:hx-get="cityUrl(city)" hx-include="[name='fahrenheit']"></div>

            </template>
            </div>

            <div
                x-show="forecastOpen"
                x-on:forecast-open.window="openForecast($event.detail)"
                x-on:keydown.escape.window="closeForecast()"
                x-on:click.self="closeForecast()"
                class="fixed inset-0 z-50 flex items-center justify-center bg-gray-950/50 p-4"
                style="display: none;"
                role="dialog"
                aria-modal="true"
                aria-labelledby="forecast-title">
                <section class="max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-xl bg-white p-5 shadow-2xl ring-1 ring-gray-900/10 sm:p-7">
                    <header class="mb-5 flex items-start justify-between gap-4">
                        <div>
                            <h2 id="forecast-title" class="text-xl font-bold text-blue-950" x-text="forecastLocation ? forecastLocation.city : '7-day forecast'"></h2>
                            <p class="mt-1 text-sm text-gray-600">The next seven days</p>
                        </div>
                        <button type="button" class="-mr-2 -mt-2 flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-2xl text-gray-600 hover:bg-gray-100 hover:text-gray-900" aria-label="Close forecast" @click="closeForecast()">&times;</button>
                    </header>

                    <p x-show="forecastLoading" class="py-8 text-center text-gray-600" role="status">Loading forecast…</p>
                    <p x-show="forecastError" class="py-8 text-center text-red-700" role="alert" x-text="forecastError"></p>
                    <div x-show="!forecastLoading && !forecastError" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4">
                        <template x-for="day in forecastDays" :key="day.date">
                            <article class="rounded-lg bg-gray-100 p-4 text-center ring-1 ring-gray-900/5">
                                <h3 class="font-semibold text-blue-950" x-text="day.date"></h3>
                                <p class="mt-2 min-h-10 text-sm capitalize text-gray-600" x-text="day.description || day.condition"></p>
                                <p class="mt-2 text-lg font-bold text-blue-950">
                                    <span x-text="`${Math.round(day.max_temp)}°${forecastLocation && forecastLocation.fahrenheit ? 'F' : 'C'}`"></span>
                                    <span class="font-normal text-gray-500" x-text="`${Math.round(day.min_temp)}°${forecastLocation && forecastLocation.fahrenheit ? 'F' : 'C'}`"></span>
                                </p>
                                <p class="mt-2 text-xs text-gray-600" x-text="`Humidity ${day.humidity}% · Rain ${Math.round(day.precipitation * 100)}%`"></p>
                            </article>
                        </template>
                    </div>
                </section>
            </div>


       </div>

         <script>

             // A saved city is either a plain name (free text) or a picked
             // suggestion {label, lat, lon}, which is fetched by coordinates.
             function cityUrl(city) {
                 if (typeof city === 'string') {
                     return `api/${city}`;
                 }
                 return `api/pos?lat=${city.lat}&lon=${city.lon}`;
             }

             function cityId(city) {
                 const key = typeof city === 'string' ? city : city.label;
                 return `${key.replace(/[^a-zA-Z0-9]+/g, '_').toLowerCase()}_v`;
             }

             function refresh_grid(id) {
                 const grid = document.getElementById(id);
                 htmx.process(grid);
             }

        </script>

    </body>
</html>
